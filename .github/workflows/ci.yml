name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DotService.slnx
      - run: dotnet format DotService.slnx --verify-no-changes --no-restore
      - run: dotnet build DotService.slnx -c Release --no-restore
      - run: dotnet test tests/DotService.Tests -c Release --no-build
      - run: dotnet run --project tests/DotService.Conformance -c Release --no-build
      - run: dotnet pack src/DotService.Hosting/DotService.Hosting.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/DotService.Packaging/DotService.Packaging.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/DotService.Cli/DotService.Cli.csproj -c Release --no-build -o artifacts/packages

